# Boing Twist: the SDK's lynx.cfg plus the cartridge's data files
# (src/directory.s, src/cart.s).
#
# lynxdev memory map (cc65 lynx.cfg, pinned here so projects can rely on it).
# Program, data and BSS (MAIN): $0200-$B837; C stack (2 KB): $B838-$C037;
# the TGI driver double-buffers at $C038 and $E018 (8160 bytes each).
# Collision detection (tgi_setcollisiondetection(1)) puts an 8160-byte
# buffer at $A058, over the end of MAIN and the stack: link such programs
# with CFG=$(LYNX_SDK)/cfg/lynx-coll.cfg (MAIN ends at $9657, stack below $A058).

SYMBOLS {
    __STACKSIZE__:        type = weak, value = $0400; # 1k stack (static locals: little is used)
    __STARTOFDIRECTORY__: type = weak, value = $00CB; # start just after loader
    __BANK0BLOCKSIZE__:   type = weak, value = $0400; # bank 0 cart block size
    __BANK1BLOCKSIZE__:   type = weak, value = $0000; # bank 1 block size
    __EXEHDR__:           type = import;
    __BOOTLDR__:          type = import;
    __DEFDIR__:           type = import;
}
